<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                <legend>Dados Pessoais</legend>
                <label for="name">Nome:</label>
                <input type="text" id="name" name="username" required>
                <br>
                <label for="age">Idade:</label>
                <input type="number" id="age" name="userage" min="12" max="100" required>
                <br>
                <label for="birthdate">Data de Nascimento:</label>
                <input type="date" id="birthdate" name="user_birthdate" required>
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="useremail" required>
                <br>
                <label for="phone_number">Telefone:</label>
                <input type="tel" id="phone_number" name="usernumberphone" pattern="[0-9]{11}" placeholder="DDD + número sem espaço ou hífen 11-99999-9999" required>
                <br>
                <label for="image">Upload de Imagem:</label>
                <input type="file" id="image" accept="image/*" name="userphoto">
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>
                <input type="radio" id="female" name="usergender" value="female">
                <label for="female">Feminino</label>

                <input type="radio" id="male" name="usergender" value="male">
                <label for="male">Masculino</label>

                <input type="radio" id="not_informed" name="usergender" value="notinformed">
                <label for="not_informed">Prefiro não informar</label>
                <br>
                
                <label for="marital_status">Estado Civil:</label>
                <select id="marital_status" name="user_marital_status">
                    <option value="notinformed">Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="uniaoestavel">União Estável</option>
                </select>

                <label for="state">Estado:</label>
                <select id="state" name="userstates">
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>

                <label for="city">Cidade:</label>
                <input type="text" id="city" name="usercity">
            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes Sociais:</p>
                <input type="checkbox" name="social" value="Instagram">
                <label for="social">Instagram</label>
                <br>
                <input type="checkbox" name="social" value="Facebook">
                <label for="social">Facebook</label>
                <br>
                <input type="checkbox" name="social" value="Linkedin">
                <label for="social">Linkedin</label>
                <br>
                <input type="checkbox" name="social" value="X">
                <label for="social">X</label>
            </fieldset>

            <input type="submit" value="Enviar">
        </form>
    </section>
</body>
</html>
